name: Build read-only OBB access probe

on:
  push:
    branches:
      - obb-access-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build diagnostic APK
        working-directory: obb_access_probe
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload read-only diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: nba2k20-obb-access-probe-api28
          path: obb_access_probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
