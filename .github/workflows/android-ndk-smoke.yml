        uses: actions/upload-artifact@v4
        with:
          name: shotmeter-dobby-v40-timing-observer-arm64
          path: build-android/artifacts/arm64-v8a/libshotmeter-v40.so
          if-no-files-found: error

      - name: Upload single-file Dobby v41 feedback-path observer
        uses: actions/upload-artifact@v4
        with:
          name: shotmeter-dobby-v41-feedback-path-arm64
          path: build-android/artifacts/arm64-v8a/libshotmeter-v41.so
          if-no-files-found: error

      - name: Upload single-file Dobby v42 second shotmeter
        uses: actions/upload-artifact@v4
        with:
          name: shotmeter-dobby-v42-second-shotmeter-arm64
          path: build-android/artifacts/arm64-v8a/libshotmeter-v42.so
          if-no-files-found: error

      - name: Upload single-file Dobby v43 player-anchor coordinate diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: shotmeter-dobby-v43-player-anchor-diagnostic-arm64
          path: build-android/artifacts/arm64-v8a/libshotmeter-v43.so
          if-no-files-found: error

      - name: Upload single-file Dobby v44 idempotent player-anchor diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: shotmeter-dobby-v44-idempotent-player-anchor-arm64
          path: build-android/artifacts/arm64-v8a/libshotmeter-v44.so
