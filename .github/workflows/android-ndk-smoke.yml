name: Android NDK ARM64 smoke test and read-only capture probe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for CMake
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Resolve Android SDK path
        shell: bash
        run: |
          if [[ -n "${ANDROID_HOME:-}" && -d "$ANDROID_HOME" ]]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [[ -n "${ANDROID_SDK_ROOT:-}" && -d "$ANDROID_SDK_ROOT" ]]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            SDK_ROOT="$HOME/.android/sdk"
          fi

          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK directory not found: $SDK_ROOT" >&2
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Resolved Android SDK: $SDK_ROOT"

      - name: Install Android NDK
        run: sdkmanager --install "ndk;30.0.16248370"

      - name: Install pinned CMake
        shell: bash
        run: |
          python -m pip install --user --disable-pip-version-check cmake==4.0.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cmake" --version
          "$HOME/.local/bin/cmake" --version | grep -F "4.0.2"

      - name: Verify installed toolchain
        shell: bash
        run: |
          test -f "$ANDROID_SDK_ROOT/ndk/30.0.16248370/build/cmake/android.toolchain.cmake"
          sdkmanager --list_installed | grep -F 'ndk;30.0.16248370'
          cmake --version

      - name: Configure ARM64 Android build
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/30.0.16248370/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build smoke library and read-only capture probe
        run: cmake --build build-android --config Release --parallel 2

      - name: Verify ARM64 ELF files and probe exports
        shell: bash
        run: |
          SMOKE="build-android/libshotmeter_ndk_smoke.so"
          PROBE="build-android/libshotmeter_probe.so"
          PROXY="build-android/libnba2k20_clean_opt.so"
          AGENT="build-android/libshotmeter.so"
          SHADOWHOOK="$(find build-android -type f -name libshadowhook.so -print -quit)"

          test -s "$SMOKE"
          test -s "$PROBE"
          test -s "$PROXY"
          test -s "$AGENT"
          test -n "$SHADOWHOOK"
          test -s "$SHADOWHOOK"

          for LIB in "$SMOKE" "$PROBE" "$PROXY" "$AGENT" "$SHADOWHOOK"; do
            echo "=== $LIB ==="
            file "$LIB"
            readelf -h "$LIB" | grep -E 'Class:|Machine:'
            readelf -h "$LIB" | grep -q 'Machine:.*AArch64'
          done

          readelf -d "$SMOKE" | grep 'NEEDED' | grep -F 'liblog.so'
          readelf -d "$PROBE" | grep 'NEEDED' | grep -F 'libshadowhook.so'
          readelf -d "$PROXY" | grep 'NEEDED' | grep -F 'libshotmeter_probe.so'
          readelf -d "$PROXY" | grep 'SONAME' | grep -F 'libnba2k20_clean_opt.so'
          readelf -d "$AGENT" | grep 'NEEDED' | grep -F 'liblog.so'
          if readelf -d "$AGENT" | grep -F 'libshadowhook.so'; then
            echo "Single-file agent unexpectedly depends on libshadowhook.so" >&2
            exit 1
          fi
          readelf --dyn-syms --wide "$SMOKE" | grep -F 'shotmeter_ndk_smoke_probe'
          readelf --dyn-syms --wide "$PROXY" | grep -F 'ANativeActivity_onCreate'
          readelf --dyn-syms --wide "$PROXY" | grep -F 'JNI_OnLoad'
          readelf --dyn-syms --wide "$PROBE" | grep -F 'shotmeter_probe_install'
          readelf --dyn-syms --wide "$PROBE" | grep -F 'shotmeter_probe_get_draw_sample_count'
          readelf --dyn-syms --wide "$PROBE" | grep -F 'shotmeter_probe_get_release_sample_count'
          readelf --dyn-syms --wide "$PROBE" | grep -F 'shotmeter_probe_get_material_sample_count'
          readelf --dyn-syms --wide "$PROBE" | grep -F 'shotmeter_probe_get_version'
          readelf --dyn-syms --wide "$AGENT" | grep -F 'Agent_OnAttach'
          readelf --dyn-syms --wide "$AGENT" | grep -F 'Agent_OnUnload'

          mkdir -p build-android/artifacts/arm64-v8a
          cp "$SMOKE" build-android/artifacts/arm64-v8a/
          cp "$PROBE" build-android/artifacts/arm64-v8a/
          cp "$PROXY" build-android/artifacts/arm64-v8a/
          cp "$AGENT" build-android/artifacts/arm64-v8a/
          cp "$SHADOWHOOK" build-android/artifacts/arm64-v8a/

      - name: Upload Android ARM64 smoke-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: shotmeter-android-arm64-ndk-smoke
          path: build-android/artifacts/arm64-v8a/libshotmeter_ndk_smoke.so
          if-no-files-found: error

      - name: Upload read-only capture probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: shotmeter-readonly-capture-arm64
          path: |
            build-android/artifacts/arm64-v8a/libshotmeter_probe.so
            build-android/artifacts/arm64-v8a/libshadowhook.so
          if-no-files-found: error

      - name: Upload NativeActivity proxy candidate
        uses: actions/upload-artifact@v4
        with:
          name: shotmeter-native-proxy-candidate-arm64
          path: |
            build-android/artifacts/arm64-v8a/libnba2k20_clean_opt.so
            build-android/artifacts/arm64-v8a/libshotmeter_probe.so
            build-android/artifacts/arm64-v8a/libshadowhook.so
          if-no-files-found: error

      - name: Upload single-file non-root JVMTI agent
        uses: actions/upload-artifact@v4
        with:
          name: shotmeter-nonroot-jvmti-agent-arm64
          path: build-android/artifacts/arm64-v8a/libshotmeter.so
          if-no-files-found: error
