name: Android NDK ARM64 smoke test and read-only capture probe

on:
  push:
    branches: [ main, v41-feedback-gate-reset, v42-second-shotmeter, v43-player-anchor-diagnostic, v44-idempotent-player-anchor, v46-player-anchored-curved-meter, v47-crescent-perfect-meter, v48-progressive-perfect-green-giant, v49-smooth-opengles-horn, v50-render-probability-diagnostics, v51-grade-aware-probability, v52-claude-shot-feedback, v53-gl-stability-probability-fix ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for CMake
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Resolve Android SDK path
        shell: bash
        run: |
          if [[ -n "${ANDROID_HOME:-}" && -d "$ANDROID_HOME" ]]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [[ -n "${ANDROID_SDK_ROOT:-}" && -d "$ANDROID_SDK_ROOT" ]]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            SDK_ROOT="$HOME/.android/sdk"
          fi

          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK directory not found: $SDK_ROOT" >&2
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Resolved Android SDK: $SDK_ROOT"

      - name: Install Android NDK
        run: sdkmanager --install "ndk;30.0.16248370"

      - name: Install pinned CMake
        shell: bash
        run: |
          python -m pip install --user --disable-pip-version-check cmake==4.0.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cmake" --version
          "$HOME/.local/bin/cmake" --version | grep -F "4.0.2"

      - name: Verify installed toolchain
        shell: bash
        run: |
          test -f "$ANDROID_SDK_ROOT/ndk/30.0.16248370/build/cmake/android.toolchain.cmake"
          sdkmanager --list_installed | grep -F 'ndk;30.0.16248370'
          cmake --version

      - name: Configure ARM64 Android build
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/30.0.16248370/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_static

      - name: Build smoke library and read-only capture probe
        run: cmake --build build-android --config Release --parallel 2

      - name: Verify ARM64 ELF files and probe exports
        shell: bash
        run: |
          SMOKE="build-android/libshotmeter_ndk_smoke.so"
          PROBE="build-android/libshotmeter_probe.so"
          PROXY="build-android/libnba2k20_clean_opt.so"
          AGENT="build-android/libshotmeter.so"
          DOBBY_AGENT="build-android/libshotmeter-v38.so"
          DOBBY_AGENT_V39="build-android/libshotmeter-v39.so"
          DOBBY_AGENT_V40="build-android/libshotmeter-v40.so"
          DOBBY_AGENT_V41="build-android/libshotmeter-v41.so"
          DOBBY_AGENT_V42="build-android/libshotmeter-v42.so"
          DOBBY_AGENT_V43="build-android/libshotmeter-v43.so"
          DOBBY_AGENT_V44="build-android/libshotmeter-v44.so"
          DOBBY_AGENT_V46="build-android/libshotmeter-v46.so"
          DOBBY_AGENT_V47="build-android/libshotmeter-v47.so"
          DOBBY_AGENT_V48="build-android/libshotmeter-v48.so"
          DOBBY_AGENT_V49="build-android/libshotmeter-v49.so"
          DOBBY_AGENT_V50="build-android/libshotmeter-v50r1.so"
          DOBBY_AGENT_V51="build-android/libshotmeter-v51.so"
          DOBBY_AGENT_V52="build-android/libshotmeter-v52.so"
          DOBBY_AGENT_V53="build-android/libshotmeter-v53.so"
          SHADOWHOOK="$(find build-android -type f -name libshadowhook.so -print -quit)"

          test -s "$SMOKE"
          test -s "$PROBE"
          test -s "$PROXY"
          test -s "$AGENT"
          test -s "$DOBBY_AGENT"
          test -s "$DOBBY_AGENT_V39"
          test -s "$DOBBY_AGENT_V40"
          test -s "$DOBBY_AGENT_V41"
          test -s "$DOBBY_AGENT_V42"
          test -s "$DOBBY_AGENT_V43"
          test -s "$DOBBY_AGENT_V44"
          test -s "$DOBBY_AGENT_V46"
          test -s "$DOBBY_AGENT_V47"
          test -s "$DOBBY_AGENT_V48"
          test -s "$DOBBY_AGENT_V49"
          test -s "$DOBBY_AGENT_V50"
          test -s "$DOBBY_AGENT_V51"
          test -s "$DOBBY_AGENT_V52"
          test -s "$DOBBY_AGENT_V53"
          test -n "$SHADOWHOOK"
          test -s "$SHADOWHOOK"

          for LIB in "$SMOKE" "$PROBE" "$PROXY" "$AGENT" "$DOBBY_AGENT" "$DOBBY_AGENT_V39" "$DOBBY_AGENT_V40" "$DOBBY_AGENT_V41" "$DOBBY_AGENT_V42" "$DOBBY_AGENT_V43" "$DOBBY_AGENT_V44" "$DOBBY_AGENT_V46" "$DOBBY_AGENT_V47" "$DOBBY_AGENT_V48" "$DOBBY_AGENT_V49" "$DOBBY_AGENT_V50" "$DOBBY_AGENT_V51" "$DOBBY_AGENT_V52" "$DOBBY_AGENT_V53" "$SHADOWHOOK"; do
            echo "=== $LIB ==="
            file "$LIB"
            readelf -h "$LIB" | grep -E 'Class:|Machine:'
            readelf -h "$LIB" | grep -q 'Machine:.*AArch64'
          done

          readelf -d "$SMOKE" | grep 'NEEDED' | grep -F 'liblog.so'
          readelf -d "$PROBE" | grep 'NEEDED' | grep -F 'libshadowhook.so'
          readelf -d "$PROXY" | grep 'NEEDED' | grep -F 'libshotmeter_probe.so'
          readelf -d "$PROXY" | grep 'SONAME' | grep -F 'libnba2k20_clean_opt.so'
          readelf -d "$AGENT" | grep 'NEEDED' | grep -F 'liblog.so'
          if readelf -d "$AGENT" | grep -F 'libshadowhook.so'; then
            echo "Single-file ShadowHook agent unexpectedly depends on libshadowhook.so" >&2
            exit 1
          fi
          if readelf -d "$DOBBY_AGENT" "$DOBBY_AGENT_V39" "$DOBBY_AGENT_V40" "$DOBBY_AGENT_V41" "$DOBBY_AGENT_V42" "$DOBBY_AGENT_V43" "$DOBBY_AGENT_V44" "$DOBBY_AGENT_V46" "$DOBBY_AGENT_V47" "$DOBBY_AGENT_V48" "$DOBBY_AGENT_V49" "$DOBBY_AGENT_V50" "$DOBBY_AGENT_V51" "$DOBBY_AGENT_V52" "$DOBBY_AGENT_V53" | grep -E 'lib(dobby|shadowhook|c\+\+_shared)\.so'; then
            echo "Dobby diagnostic agent unexpectedly has a separate hook-engine or shared C++ dependency" >&2
            exit 1
          fi
          readelf --dyn-syms --wide "$SMOKE" | grep -F 'shotmeter_ndk_smoke_probe'
          readelf --dyn-syms --wide "$PROXY" | grep -F 'ANativeActivity_onCreate'
          readelf --dyn-syms --wide "$PROXY" | grep -F 'JNI_OnLoad'
          readelf --dyn-syms --wide "$PROBE" | grep -F 'shotmeter_probe_install'
          readelf --dyn-syms --wide "$PROBE" | grep -F 'shotmeter_probe_get_draw_sample_count'
          readelf --dyn-syms --wide "$PROBE" | grep -F 'shotmeter_probe_get_release_sample_count'
          readelf --dyn-syms --wide "$PROBE" | grep -F 'shotmeter_probe_get_material_sample_count'
          readelf --dyn-syms --wide "$PROBE" | grep -F 'shotmeter_probe_get_version'
          readelf --dyn-syms --wide "$AGENT" | grep -F 'Agent_OnAttach'
          readelf --dyn-syms --wide "$AGENT" | grep -F 'Agent_OnUnload'
          readelf --dyn-syms --wide "$DOBBY_AGENT" | grep -F 'Agent_OnAttach'
          readelf --dyn-syms --wide "$DOBBY_AGENT" | grep -F 'Agent_OnUnload'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V39" | grep -F 'Agent_OnAttach'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V39" | grep -F 'Agent_OnUnload'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V40" | grep -F 'Agent_OnAttach'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V40" | grep -F 'Agent_OnUnload'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V41" | grep -F 'Agent_OnAttach'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V41" | grep -F 'Agent_OnUnload'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V42" | grep -F 'Agent_OnAttach'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V42" | grep -F 'Agent_OnUnload'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V43" | grep -F 'Agent_OnAttach'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V43" | grep -F 'Agent_OnUnload'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V44" | grep -F 'Agent_OnAttach'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V44" | grep -F 'Agent_OnUnload'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V46" | grep -F 'Agent_OnAttach'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V46" | grep -F 'Agent_OnUnload'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V47" | grep -F 'Agent_OnAttach'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V47" | grep -F 'Agent_OnUnload'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V48" | grep -F 'Agent_OnAttach'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V48" | grep -F 'Agent_OnUnload'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V49" | grep -F 'Agent_OnAttach'
          readelf --dyn-syms --wide "$DOBBY_AGENT_V49" | grep -F 'Agent_OnUnload'
          strings "$DOBBY_AGENT" | grep -F 'shotmeter.dobby-diagnostic'
          strings "$DOBBY_AGENT" | grep -F 'Dobby'
          strings "$DOBBY_AGENT_V39" | grep -F 'shotmeter.dobby-v39-diagnostic'
          strings "$DOBBY_AGENT_V39" | grep -F '_ZN22ShotIndicatorComponent6DoDrawEP12AI_NBA_ACTOR'
          strings "$DOBBY_AGENT_V39" | grep -F '_Z20EVT_UserShotReleasedP12AI_NBA_ACTOR23MVS_SHOT_RELEASE_TIMINGff'
          strings "$DOBBY_AGENT_V39" | grep -F '_ZNK22ShotIndicatorComponent18SetMaterialEnabledE10string_crc5_bool'
          strings "$DOBBY_AGENT_V39" | grep -F 'Dobby'
          strings "$DOBBY_AGENT_V40" | grep -F 'shotmeter.dobby-v40-timing-diagnostic'
          strings "$DOBBY_AGENT_V40" | grep -F '_Z24HUR_GetShotReleaseTimingPK12AI_NBA_ACTORf'
          strings "$DOBBY_AGENT_V40" | grep -F '_Z35HUR_GetReleaseTimingThresholdValuesPK12AI_NBA_ACTORPf'
          strings "$DOBBY_AGENT_V40" | grep -F '_Z41HUR_GetReleaseTimingWindowBoundsForTimingPK12AI_NBA_ACTOR23MVS_SHOT_RELEASE_TIMINGRfS3_'
          strings "$DOBBY_AGENT_V40" | grep -F '_Z20EVT_UserShotReleasedP12AI_NBA_ACTOR23MVS_SHOT_RELEASE_TIMINGff'
          strings "$DOBBY_AGENT_V40" | grep -F 'Dobby'
          strings "$DOBBY_AGENT_V41" | grep -F 'shotmeter.dobby-v41-feedback-diagnostic'
          strings "$DOBBY_AGENT_V41" | grep -F 'shotmeter.dobby-v41-reset'
          strings "$DOBBY_AGENT_V41" | grep -F '_ZN21ShotFeedbackComponent10ShouldShowEP12AI_NBA_ACTOR'
          strings "$DOBBY_AGENT_V41" | grep -F '_ZN21ShotFeedbackComponent4DrawEv'
          strings "$DOBBY_AGENT_V41" | grep -F '_ZN21ShotFeedbackComponent6DoDrawEi'
          strings "$DOBBY_AGENT_V41" | grep -F 'Dobby'
          strings "$DOBBY_AGENT_V42" | grep -F 'shotmeter.dobby-v42-second-meter-diagnostic'
          strings "$DOBBY_AGENT_V42" | grep -F 'shotmeter.dobby-v42-reset'
          strings "$DOBBY_AGENT_V42" | grep -F 'g_ShotIndicatorComponent'
          strings "$DOBBY_AGENT_V42" | grep -F 'eglSwapBuffers'
          strings "$DOBBY_AGENT_V42" | grep -F 'Dobby'
          strings "$DOBBY_AGENT_V43" | grep -F 'shotmeter.dobby-v43-coordinate-diagnostic'
          strings "$DOBBY_AGENT_V43" | grep -F '_ZN22ShotIndicatorComponent6DoDrawEP12AI_NBA_ACTOR'
          strings "$DOBBY_AGENT_V43" | grep -F '_Z30PlayerIconUtil_GetHeadLocationP12AI_NBA_ACTORRDv4_f'
          strings "$DOBBY_AGENT_V43" | grep -F '_Z32PlayerIconManager3D_GetSavedViewv'
          strings "$DOBBY_AGENT_V43" | grep -F '_Z14VCView_ProjectPK6VCVIEWPKDv4_fPS2_'
          strings "$DOBBY_AGENT_V43" | grep -F 'Dobby'
          strings "$DOBBY_AGENT_V44" | grep -F 'shotmeter.dobby-v44-coordinate-diagnostic'
          strings "$DOBBY_AGENT_V44" | grep -F 'duplicate Agent_OnAttach call ignored'
          strings "$DOBBY_AGENT_V44" | grep -F '_ZN22ShotIndicatorComponent6DoDrawEP12AI_NBA_ACTOR'
          strings "$DOBBY_AGENT_V44" | grep -F '_Z30PlayerIconUtil_GetHeadLocationP12AI_NBA_ACTORRDv4_f'
          strings "$DOBBY_AGENT_V44" | grep -F '_Z32PlayerIconManager3D_GetSavedViewv'
          strings "$DOBBY_AGENT_V44" | grep -F '_Z14VCView_ProjectPK6VCVIEWPKDv4_fPS2_'
          strings "$DOBBY_AGENT_V44" | grep -F 'Dobby'
          strings "$DOBBY_AGENT_V46" | grep -F 'shotmeter.dobby-v46-player-anchored-diagnostic'
          strings "$DOBBY_AGENT_V46" | grep -F 'eglSwapBuffers'
          strings "$DOBBY_AGENT_V46" | grep -F '_ZN22ShotIndicatorComponent6DoDrawEP12AI_NBA_ACTOR'
          strings "$DOBBY_AGENT_V46" | grep -F '_Z30PlayerIconUtil_GetHeadLocationP12AI_NBA_ACTORRDv4_f'
          strings "$DOBBY_AGENT_V46" | grep -F '_Z32PlayerIconManager3D_GetSavedViewv'
          strings "$DOBBY_AGENT_V46" | grep -F '_Z14VCView_ProjectPK6VCVIEWPKDv4_fPS2_'
          strings "$DOBBY_AGENT_V46" | grep -F 'Dobby'
          strings "$DOBBY_AGENT_V47" | grep -F 'shotmeter.dobby-v47-crescent-perfect-diagnostic'
          strings "$DOBBY_AGENT_V48" | grep -F 'shotmeter.dobby-v48-progressive-perfect-diagnostic'
          strings "$DOBBY_AGENT_V48" | grep -F 'perfect_class3_release_events'
          strings "$DOBBY_AGENT_V49" | grep -F 'shotmeter.dobby-v49-smooth-opengles-horn-diagnostic'
          strings "$DOBBY_AGENT_V49" | grep -F '_Z20EVT_UserShotReleasedP12AI_NBA_ACTOR23MVS_SHOT_RELEASE_TIMINGff'
          strings "$DOBBY_AGENT_V49" | grep -F 'Green Giant'
          strings "$DOBBY_AGENT_V50" | grep -F 'shotmeter.dobby-v50r1-audited-diagnostic'
          strings "$DOBBY_AGENT_V50" | grep -F 'agent=v50.1'
          strings "$DOBBY_AGENT_V50" | grep -F 'probability_hooks_enabled=0'
          strings "$DOBBY_AGENT_V50" | grep -F 'eglSwapBuffers'
          strings "$DOBBY_AGENT_V50" | grep -F 'Green Giant'
          strings "$DOBBY_AGENT_V50" | grep -F 'Dobby'
          strings "$DOBBY_AGENT_V51" | grep -F 'shotmeter.dobby-v51-grade-aware-probability'
          strings "$DOBBY_AGENT_V51" | grep -F 'agent=v51'
          strings "$DOBBY_AGENT_V51" | grep -F 'GRADE_AWARE_CHANCE_REMAP_V1'
          strings "$DOBBY_AGENT_V51" | grep -F 'probability_hooks_enabled='
          strings "$DOBBY_AGENT_V51" | grep -F 'shot_feedback_probability_storage_modified=0'
          strings "$DOBBY_AGENT_V51" | grep -F '_Z30PHY_LaunchShotBalancedDiceRollP8AI_ACTORP7AI_BALLif5_bool19PHY_SHOT_TRAJECTORY23MVS_SHOT_RELEASE_TIMING'
          strings "$DOBBY_AGENT_V51" | grep -F '_ZNK8AI_ACTOR11GetLocationEPDv4_f'
          strings "$DOBBY_AGENT_V51" | grep -F '_Z32MTH_GetDistanceFromPointToBasketPKDv4_f'
          strings "$DOBBY_AGENT_V51" | grep -F '_Z40JumpshotFeedback_TranslatePercentToGradeff'
          strings "$DOBBY_AGENT_V51" | grep -F 'Dobby'
          strings "$DOBBY_AGENT_V52" | grep -F 'shotmeter.dobby-v52-claude-shot-feedback'
          strings "$DOBBY_AGENT_V52" | grep -F 'CLAUDE_SDF_NEON_PANEL'
          strings "$DOBBY_AGENT_V52" | grep -F 'WIPE_UP_BOTTOM_TO_TOP'
          strings "$DOBBY_AGENT_V52" | grep -F 'eglSwapBuffers'
          strings "$DOBBY_AGENT_V52" | grep -F '_Z20EVT_UserShotReleasedP12AI_NBA_ACTOR23MVS_SHOT_RELEASE_TIMINGff'
          strings "$DOBBY_AGENT_V52" | grep -F '_Z30PHY_LaunchShotBalancedDiceRollP8AI_ACTORP7AI_BALLif5_bool19PHY_SHOT_TRAJECTORY23MVS_SHOT_RELEASE_TIMING'
          strings "$DOBBY_AGENT_V52" | grep -F 'Dobby'
           strings "$DOBBY_AGENT_V53" | grep -F 'shotmeter.dobby-v53-gl-stability-probability'
           strings "$DOBBY_AGENT_V53" | grep -F 'probability_map_self_test_status='
           strings "$DOBBY_AGENT_V53" | grep -F 'gl_last_error_stage='
           strings "$DOBBY_AGENT_V53" | grep -F 'WIPE_UP_BOTTOM_TO_TOP'
           strings "$DOBBY_AGENT_V53" | grep -F 'Dobby'
          strings "$DOBBY_AGENT_V47" | grep -F '_Z20EVT_UserShotReleasedP12AI_NBA_ACTOR23MVS_SHOT_RELEASE_TIMINGff'
          strings "$DOBBY_AGENT_V47" | grep -F 'perfect_class3_release_events'
          strings "$DOBBY_AGENT_V47" | grep -F 'OpenSLES'
          strings "$DOBBY_AGENT_V47" | grep -F 'Dobby'
          strings "$AGENT" | grep -F 'shotmeter.library-loaded'
          strings "$AGENT" | grep -F 'shotmeter.agent-attached'
          strings "$AGENT" | grep -F 'shotmeter.probe-result'
          strings "$AGENT" | grep -F 'shotmeter.init-diagnostic'

          mkdir -p build-android/artifacts/arm64-v8a
          cp "$SMOKE" build-android/artifacts/arm64-v8a/
          cp "$PROBE" build-android/artifacts/arm64-v8a/
          cp "$PROXY" build-android/artifacts/arm64-v8a/
          cp "$AGENT" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT_V39" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT_V40" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT_V41" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT_V42" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT_V43" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT_V44" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT_V46" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT_V47" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT_V48" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT_V49" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT_V50" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT_V51" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT_V52" build-android/artifacts/arm64-v8a/
          cp "$DOBBY_AGENT_V53" build-android/artifacts/arm64-v8a/
          cp "$SHADOWHOOK" build-android/artifacts/arm64-v8a/

      - name: Upload Android ARM64 smoke-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: shotmeter-android-arm64-ndk-smoke
          path: build-android/artifacts/arm64-v8a/libshotmeter_ndk_smoke.so
          if-no-files-found: error

      - name: Upload read-only capture probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: shotmeter-readonly-capture-arm64
          path: |
            build-android/artifacts/arm64-v8a/libshotmeter_probe.so
            build-android/artifacts/arm64-v8a/libshadowhook.so
          if-no-files-found: error

      - name: Upload NativeActivity proxy candidate
        uses: actions/upload-artifact@v4
        with:
          name: shotmeter-native-proxy-candidate-arm64
          path: |
            build-android/artifacts/arm64-v8a/libnba2k20_clean_opt.so
            build-android/artifacts/arm64-v8a/libshotmeter_probe.so
            build-android/artifacts/arm64-v8a/libshadowhook.so
          if-no-files-found: error

      - name: Upload single-file non-root JVMTI agent
        uses: actions/upload-artifact@v4
        with:
          name: shotmeter-nonroot-jvmti-agent-arm64
          path: build-android/artifacts/arm64-v8a/libshotmeter.so
          if-no-files-found: error

      - name: Upload single-file Dobby v38 diagnostic agent
