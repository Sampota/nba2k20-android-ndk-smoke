name: Build Patch APK Tool Android app

on:
  push:
    branches: [apk-patcher-android-app]
    paths:
      - "apk-patcher/**"
      - ".github/workflows/build-apk-patcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-patcher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools,platforms;android-35,build-tools;35.0.0"

      - name: Build debug APK
        run: gradle -p apk-patcher --no-daemon clean assembleDebug

      - name: Verify generated APK signature
        run: |
          apksigner verify --verbose --print-certs apk-patcher/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Patch APK Tool
        uses: actions/upload-artifact@v4
        with:
          name: patch-apk-tool-debug-apk
          path: apk-patcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
